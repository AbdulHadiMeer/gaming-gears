<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Ultra Play</title>

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="products.css">

<script src="index.js" defer></script>
</head>

<body>

<!-- NAVBAR -->
<header>
  <nav class="navbar">

    <div class="logo">⚡ Ultra Play</div>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html" class="active">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-right">
      <button class="admin-btn" onclick="openAdminLogin()">Admin</button>

      <div  class="cart">
        <a class="crt" href="cart.html">🛒 </a><span id="cart-count">0</span>
      </div>

      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    </div>

  </nav>
</header>

<!-- HERO -->
<section class="products-hero">
  <div class="hero-content">
    <h1>🎮 Gaming Products</h1>
    <p>Upgrade your setup with premium gear</p>
  </div>
</section>

<!-- SEARCH + FILTER -->
<section class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Search products...">
  <select id="categoryFilter">
    <option value="all">All Categories</option>
    <option value="mouse">Mouse</option>
    <option value="keyboard">Keyboard</option>
    <option value="headset">Headset</option>
  </select>
</section>

<!-- PRODUCTS GRID -->
<main class="products-container">
  <h2 class="all">All Products</h2>
  <div class="grid" id="product-grid">
    <!-- Products injected by JS -->
  </div>
</main>

<!-- ADMIN LOGIN MODAL -->
<div id="admin-login-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeAdminLogin()">&times;</span>
    <h2>Admin Login</h2>
    <input type="password" id="admin-password" placeholder="Enter Password">
    <button onclick="checkAdminPassword()">Login</button>
    <p id="login-error" style="color:red;"></p>
  </div>
</div>

<!-- ADMIN PANEL MODAL -->
<div id="admin-panel-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeAdminPanel()">&times;</span>
    <h2>Admin Panel</h2>

    <input type="text" id="product-name" placeholder="Product Name">
    <input type="text" id="product-price" placeholder="Price">
    <input type="text" id="product-img" placeholder="Image URL">
    <input type="text" id="product-detail" placeholder="Detail">

    <button onclick="addProduct()">Add Product</button>

    <h3>Manage Products</h3>
    <div id="admin-products-list"></div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 Ultra Play Store | All Rights Reserved</p>
</footer>

</body>
</html>
